server.port=8080

# Nombre de la aplicación (se registrará en Eureka)
spring.application.name=api-gateway

# Configuración de Eureka Client para descubrir otros servicios
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Configuración de rutas del Gateway

# Ruta para el microservicio de productos
spring.cloud.gateway.routes[0].id=productos
spring.cloud.gateway.routes[0].uri=lb://productos
spring.cloud.gateway.routes[0].predicates[0]=Path=/productos/**

# Ruta para el microservicio de pedidos
spring.cloud.gateway.routes[1].id=pedidos
spring.cloud.gateway.routes[1].uri=lb://pedidos
spring.cloud.gateway.routes[1].predicates[0]=Path=/pedidos/**


eureka.instance.leaseRenewalIntervalInSeconds=5
eureka.instance.leaseExpirationDurationInSeconds=10
eureka.instance.prefer-ip-address=true


eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


